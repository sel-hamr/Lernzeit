<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="4 4 56 56" role="img" aria-label="sel-hamr"><title>sel-hamr</title><style>@keyframes blink{0%,86%,100%{transform:scaleY(1)}88%{transform:scaleY(.1)}90%{transform:scaleY(1)}93%{transform:scaleY(.1)}95%{transform:scaleY(1)}}@keyframes look{0%,18%{transform:translate(0,0)}24%,40%{transform:translate(4px,-2px)}46%,62%{transform:translate(-4px,0)}68%,100%{transform:translate(0,0)}}.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}.eyes{animation:look 11s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.eye,.eyes{animation:none}}</style><mask id="m"><rect x="4" y="4" width="56" height="56" rx="19" fill="#fff"/><g class="eyes"><rect class="eye" x="23" y="21" width="8" height="19" rx="4" fill="#000"/><rect class="eye" x="38" y="21" width="8" height="19" rx="4" fill="#000"/></g></mask><rect x="4" y="4" width="56" height="56" rx="19" fill="#2E5BFF" mask="url(#m)"/></svg>
